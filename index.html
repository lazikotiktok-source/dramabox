<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaBox - Kino Ko'rish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .poster {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            border-radius: 12px;
            outline: none;
            background: #000;
        }
        .error {
            color: #ff4d4d;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1 id="title">Kino yuklanmoqda...</h1>
    <div id="content"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function loadData() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const movieKey = urlParams.get('movie');
            
            const response = await fetch('movies.json');
            const movies = await response.json();

            if (movieKey && movies[movieKey]) {
                const movie = movies[movieKey];
                document.getElementById('title').innerText = movie.title;
                
                let videoUrl = '';
                if (movie.episodes && movie.episodes.length > 0) {
                    videoUrl = movie.episodes[0].url;
                }

                document.getElementById('content').innerHTML = `
                    <video controls autoplay playsinline src="${videoUrl}"></video>
                `;
            } else {
                document.getElementById('title').innerText = "Kino topilmadi!";
            }
        } catch (e) {
            document.getElementById('title').innerText = "Xatolik yuz berdi!";
            console.error(e);
        }
    }

    loadData();
</script>

</body>
